<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل شخصية - MT</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="hero">

    <div class="mt-logo">MT</div>

    <div class="page-heading">

        <h1>تسجيل شخصية</h1>

        <p>أدخل بيانات الشخصية الجديدة</p>

    </div>

</header>


<main class="character-page">

    <section class="characters-box character-register-box">

        <div class="section-header">

            <h2>بيانات الشخصية</h2>

            <span class="section-line"></span>

        </div>


        <form method="POST" class="character-form">

            <div class="form-group">

                <label for="first_name">الاسم الأول</label>

                <input
                    id="first_name"
                    type="text"
                    name="first_name"
                    placeholder="اكتب الاسم الأول"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="second_name">الاسم الثاني</label>

                <input
                    id="second_name"
                    type="text"
                    name="second_name"
                    placeholder="اكتب الاسم الثاني"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="country">الدولة</label>

                <input
                    id="country"
                    type="text"
                    name="country"
                    placeholder="اكتب الدولة"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="nationality">الجنسية</label>

                <input
                    id="nationality"
                    type="text"
                    name="nationality"
                    placeholder="اكتب الجنسية"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="birth_date">تاريخ الميلاد</label>

                <input
                    id="birth_date"
                    type="date"
                    name="birth_date"
                    required
                >

            </div>


            <button type="submit" class="register-button">
                تسجيل الشخصية
            </button>

        </form>

    </section>

</main>


<footer>
    MT Character System © 2026
</footer>


</body>
</html>
